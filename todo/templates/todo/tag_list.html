{% extends 'todo/base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Tags</h2>
    <a href="{% url 'todo:tag-create' %}" class="btn btn-primary">Add tag</a>
</div>

<table class="table table-bordered">
    <thead>
        <tr>
            <th>Name</th>
            <th style="width: 200px;">Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for tag in tags %}
        <tr>
            <td>{{ tag.name }}</td>
            <td>
                <a href="{% url 'todo:tag-update' tag.pk %}" class="btn btn-sm btn-outline-primary">Update</a>
                <a href="{% url 'todo:tag-delete' tag.pk %}" class="btn btn-sm btn-outline-danger">Delete</a>
            </td>
        </tr>
        {% empty %}
        <tr><td colspan="2">No tags available.</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
