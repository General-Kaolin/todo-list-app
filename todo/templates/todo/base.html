<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>TODO List</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container-fluid">
    <div class="row min-vh-100">
        <div class="col-md-3 col-lg-2 bg-light p-3 border-end">
            <h4>TODO App</h4>
            <hr>
            <ul class="nav nav-pills flex-column">
                <li class="nav-item mb-1">
                    <a href="{% url 'todo:task-list' %}" class="nav-link {% if request.resolver_match.url_name == 'task-list' %}active{% else %}link-dark{% endif %}">Home (Tasks)</a>
                </li>
                <li class="nav-item">
                    <a href="{% url 'todo:tag-list' %}" class="nav-link {% if request.resolver_match.url_name == 'tag-list' %}active{% else %}link-dark{% endif %}">Tag list</a>
                </li>
            </ul>
        </div>

        <div class="col-md-9 col-lg-10 p-4">
            {% block content %}{% endblock %}
        </div>
    </div>
</div>

</body>
</html>
