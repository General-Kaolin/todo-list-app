{% extends 'todo/base.html' %}

{% block content %}
<div class="row">
    <div class="col-md-5">
        <div class="card shadow-sm p-4">
            <h2 class="mb-4">{% if object %}Update Tag{% else %}Add Tag{% endif %}</h2>

            <form method="post">
                {% csrf_token %}

                <div class="mb-3">
                    <label for="{{ form.name.id_for_label }}" class="form-label fw-bold">Name</label>
                    {{ form.name }}
                    {% if form.name.errors %}
                        <div class="text-danger small">{{ form.name.errors }}</div>
                    {% endif %}
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success">Save</button>
                    <a href="{% url 'todo:tag-list' %}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
